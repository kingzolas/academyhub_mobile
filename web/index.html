  <style>
    flt-platform-view,
    flt-platform-view-slot,
    flt-platform-view iframe {
      width: 100% !important;
      height: 100% !important;
    }

    flt-platform-view video,
    video {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 1px !important;
      min-height: 1px !important;
      object-fit: cover !important;
      opacity: 1 !important;
      visibility: visible !important;
      background: transparent !important;
    }
  </style>
  <script>
    (function () {
      function patchCameraVideo(video) {
        if (!video || video.dataset.academyhubCameraPatched === 'true') return;

        video.dataset.academyhubCameraPatched = 'true';
        video.setAttribute('autoplay', 'true');
        video.setAttribute('muted', 'true');
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        video.autoplay = true;
        video.muted = true;
        video.defaultMuted = true;
        video.controls = false;

        video.style.display = 'block';
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.minWidth = '1px';
        video.style.minHeight = '1px';
        video.style.objectFit = 'cover';
        video.style.opacity = '1';
        video.style.visibility = 'visible';
        video.style.background = 'transparent';

        video.addEventListener('loadedmetadata', function () {
          console.log(
            '[AcademyHubCameraPatch] loadedmetadata',
            video.videoWidth,
            video.videoHeight,
            video.readyState
          );
          var playResult = video.play();
          if (playResult && playResult.catch) {
            playResult.catch(function (error) {
              console.warn('[AcademyHubCameraPatch] video.play falhou', error);
            });
          }
        });

        video.addEventListener('canplay', function () {
          console.log(
            '[AcademyHubCameraPatch] canplay',
            video.videoWidth,
            video.videoHeight,
            video.readyState
          );
        });
      }

      function patchAllVideos() {
        document.querySelectorAll('video').forEach(patchCameraVideo);
      }

      window.addEventListener('DOMContentLoaded', patchAllVideos);
      new MutationObserver(patchAllVideos).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
  </script>
